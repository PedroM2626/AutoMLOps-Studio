name: Build Desktop App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows running the workflow manually from the Actions tab

jobs:
  build:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'npm'

      - name: Install Node dependencies
        shell: bash
        run: |
          # The electron package downloads its binary during postinstall, and that
          # mirror intermittently answers 5xx, which used to fail the whole matrix.
          for attempt in 1 2 3; do
            if npm install; then
              exit 0
            fi
            echo "npm install failed on attempt ${attempt} of 3; retrying in 20s"
            sleep 20
          done
          echo "npm install failed on all 3 attempts"
          exit 1

      - name: Build Electron App (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run dist -- --win

      - name: Build Electron App (macOS)
        if: matrix.os == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --mac

      - name: Build Electron App (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npm run dist -- --linux

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: automlops-studio-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          retention-days: 7
