services:
  # API service (FastAPI)
  api:
    build: .
    container_name: automl-api
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      # Optional: a fresh clone has no .env (it is gitignored), and requiring one made
      # "docker compose up" fail before any container started.
      - path: .env
        required: false
    restart: unless-stopped

  # Dashboard service (Streamlit)
  dashboard:
    build: .
    container_name: automl-dashboard
    command: python -m streamlit run app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    env_file:
      - path: .env
        required: false
    depends_on:
      - api
    restart: unless-stopped

  # MLflow UI (experiment viewer)
  mlflow:
    # Built from this repo so the UI and the client agree on one mlflow version: the
    # pinned ghcr image predates the 3.x store schema this app migrates into mlflow.db.
    # Points at the SQLite database in the repo root and artifacts under mlruns.
    build: .
    command: mlflow ui --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////app/mlflow.db --default-artifact-root /app/mlruns
    container_name: automl-mlflow
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    restart: unless-stopped
